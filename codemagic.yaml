workflows:
  ios-test-build:
    name: iOS Test Build (Simulator Mode)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build iOS for Simulator (No Signing Required)
        script: |
          # Build untuk simulator untuk mengecek kompatibilitas kode tanpa perlu sertifikat
          flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app
