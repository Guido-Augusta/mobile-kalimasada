workflows:
  ios-test-build:
    name: iOS Test Build (Simulator Mode)
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      groups:
        - api_config
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Create .env File from Environment Variables
        script: |
          # Membuat file .env menggunakan variable dari dashboard Codemagic
          echo "BASE_URL=$BASE_URL" > .env
          echo "APP_DEBUG=$APP_DEBUG" >> .env
          cat .env
      - name: Build iOS for Simulator (No Signing Required)
        script: |
          # Build untuk simulator dengan flag untuk mematikan Device Preview
          flutter build ios --simulator --debug --dart-define=HIDE_DEVICE_PREVIEW=true
    artifacts:
      - build/ios/iphonesimulator/*.app
